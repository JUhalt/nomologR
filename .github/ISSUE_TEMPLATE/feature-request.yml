name: Feature request
description: Propose a new capability or improvement.
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Researcher need
      description: What research or construct-validation problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the behavior or workflow you would like nomologR to support.
    validations:
      required: true
  - type: textarea
    id: methods
    attributes:
      label: Methodological basis
      description: If applicable, identify statistical methods, estimands, references, or existing R implementations.
  - type: textarea
    id: philosophy
    attributes:
      label: Researcher-control considerations
      description: Note any decisions the package should expose rather than automate.
